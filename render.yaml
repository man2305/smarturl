# Render Blueprint — deploys the API as a free Docker web service.
# Docs: https://render.com/docs/blueprint-spec
#
# After creating your Render account, click "New > Blueprint" and point it at
# this repo (or push this file to your GitHub repo and use "Deploy Blueprint").
#
# Sync the free services at https://render.com:
#   1. MongoDB Atlas  -> M0 free cluster, copy the SRV URI into MONGODB_URI
#   2. Upstash Redis  -> free database, copy the rediss:// URI into REDIS_URL
#   3. This service -> set the `sync: false` vars (BASE_URL, CLIENT_URL,
#      JWT_ACCESS_SECRET, JWT_REFRESH_SECRET) in the dashboard.
#
# Free-tier note: Render free web services sleep after 15 min of inactivity and
# cold-start on the next request (a few seconds to ~30s the first time).

services:
  - type: web
    name: smarturl-api
    runtime: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: JWT_ISSUER
        value: smarturl
      - key: JWT_AUDIENCE
        value: smarturl-api
      # Public origin of this API — becomes https://<your-service>.onrender.com
      - key: BASE_URL
        sync: false
      # Origin of the Vercel frontend — https://<your-project>.vercel.app
      - key: CLIENT_URL
        sync: false
      # MongoDB Atlas M0 connection string (mongodb+srv://...)
      - key: MONGODB_URI
        sync: false
      # Upstash Redis URL (rediss://...) — optional, app degrades to DB-only
      - key: REDIS_URL
        sync: false
      # Generate strong values: openssl rand -base64 48
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
